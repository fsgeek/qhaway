name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    # Linux is where it was built; macOS is the Claude Desktop host; Windows is
    # the majority desktop and the one that surfaced fcntl/NTFS/CRLF breakage
    # nothing else could see (2026-09-01).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Sync (locked, dev group)
        # --locked fails if uv.lock is out of date with pyproject.toml, so a
        # drifted lock is caught here, not discovered at runtime.
        run: uv sync --locked --group dev

      - name: Run tests
        # The live-store (reground) tests skip cleanly without an ArangoDB or a
        # ~/.yanantin config, so the base suite is fully green in CI.
        run: uv run --no-sync pytest -q

  wheel:
    # The artifact a stranger installs, not the editable checkout: build the
    # wheel, install it into a clean venv, run the main command. The editable
    # suite was green for five releases while bare `qhaway index` wrote nothing
    # (fixed in 0.5.1) — only installing the artifact can see that class.
    name: wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Install the wheel into a clean venv and smoke-test it
        shell: bash
        run: |
          uv venv smoke-venv --python 3.14
          uv pip install --python smoke-venv dist/*.whl
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=smoke-venv/Scripts; else BIN=smoke-venv/bin; fi
          "$BIN/python" -c "import qhaway; assert qhaway.__version__ != '0.0.0+unknown', 'wheel metadata missing'; print(qhaway.__version__)"
          mkdir smoke-store
          printf -- '---\nname: smoke\ntype: project\ndescription: wheel smoke\n---\nbody\n' > smoke-store/smoke.md
          "$BIN/qhaway" index --dir smoke-store
          grep -q "smoke" smoke-store/MEMORY.md  # the main command wrote the index

  audit:
    # Security floor, kept green: known-vuln scan of locked deps, static
    # analysis of the source, and workflow-security lint. Tool versions pinned;
    # bump them deliberately. GH_TOKEN lets zizmor resolve pinned action SHAs.
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Audit locked runtime dependencies for known vulnerabilities
        run: |
          uv export --no-emit-project --no-dev -o requirements-audit.txt
          uvx pip-audit==2.10.1 -r requirements-audit.txt --no-deps

      - name: Static analysis (bandit, medium+)
        run: uvx bandit==1.9.4 -r src -ll

      - name: Workflow security lint (zizmor)
        run: uvx zizmor==1.30.0 .github/workflows/
        env:
          GH_TOKEN: ${{ github.token }}
