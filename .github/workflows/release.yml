name: Release

permissions:
  contents: read

# Tag push (vX.Y.Z): build, smoke, publish to TESTPYPI, attach artifacts to the
# GitHub release. Publishing to real PyPI is DELIBERATELY not automated — the
# release flow keeps a human-visible judgment point between "the wheel installs
# and works from TestPyPI" and "strangers get it": verify, then run
#   uv publish --token "$PYPI_DEPLOY_KEY_REAL" dist/qhaway-X.Y.Z*
# (Decision 2026-09-03; revisit when the project has more release history.)
#
# If/when auto-publish to real PyPI is built, the controls it requires (agreed
# 2026-09-03, before any implementation):
#   1. Trusted publishing (OIDC) — no long-lived token in secrets; configured
#      on pypi.org by the account owner, scoped to this repo+workflow+environment.
#   2. A protected `release` GitHub environment with a required reviewer — the
#      same human judgment point as today's manual publish, minus the toil.
#   3. Tag protection: only maintainers may push v* tags (the trigger).
#   4. PEP 740 provenance attestations, so an installed wheel is traceable to
#      the CI run and commit that produced it.
#   5. This smoke step stays in the path — nothing publishes what it hasn't
#      installed and run.
#
# Note on --check-url: a workflow_dispatch on main after unreleased commits
# will correctly FAIL here — same version, different bytes. That is the guard
# working (it means the version was not bumped), not a pipeline bug.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-testpypi:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload artifacts to the GitHub release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Never build a published artifact from a poisonable cache.
          enable-cache: false

      - name: Build
        run: uv build

      - name: Smoke-test the wheel
        run: |
          uv venv smoke-venv --python 3.14
          uv pip install --python smoke-venv dist/*.whl
          smoke-venv/bin/python -c "import qhaway; print(qhaway.__version__)"
          mkdir smoke-store
          printf -- '---\nname: smoke\ntype: project\ndescription: wheel smoke\n---\nbody\n' > smoke-store/smoke.md
          smoke-venv/bin/qhaway index --dir smoke-store
          grep -q smoke smoke-store/MEMORY.md

      - name: Publish to TestPyPI
        # --check-url makes re-runs idempotent: files already on TestPyPI are
        # skipped instead of failing the workflow.
        run: uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/ --token "$PYPI_TEST_TOKEN" dist/*
        env:
          PYPI_TEST_TOKEN: ${{ secrets.PYPI_DEPLOY_KEY_TEST }}

      - name: Attach artifacts to the GitHub release (if one exists for this tag)
        if: github.ref_type == 'tag'
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber || echo "no release for $GITHUB_REF_NAME yet; artifacts stay in the workflow run"
        env:
          GH_TOKEN: ${{ github.token }}
